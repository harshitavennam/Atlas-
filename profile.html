<html lang="en">

    h2 { margin: 4px 0 16px; color: #2563eb; font-size: 1.1rem; }
    ul { padding-left: 20px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <h1>Harshitha Vennam</h1>
      <h2>Frontend Developer, Project Atlas</h2>
      <p>I build clean, simple web pages and I am learning how teams
         ship code safely with Git and Pull Requests.</p>
      <h3>Skills</h3>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Git and GitHub</li>
      </ul>
      <a href="https://github.com/harshitavennam">Click here</a>
    </article>
  </main>
</body>
</html>
